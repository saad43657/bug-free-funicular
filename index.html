<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>Zainab Earn • All Buttons Working + Live Chat</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
* { margin:0; padding:0; box-sizing:border-box; font-family:'Poppins', sans-serif; }
body { background: linear-gradient(135deg, #0f0c29, #302b63, #24243e); color: white; min-height: 100vh; }
.auth-page { height: 100vh; display: flex; justify-content: center; align-items: center; }
.box { width: 360px; background: rgba(255,255,255,0.07); padding: 30px; border-radius: 20px; backdrop-filter: blur(15px); border: 1px solid rgba(0,255,204,0.15); }
.box h2 { color: #00ffcc; text-align: center; margin-bottom: 20px; }
.input-group { position: relative; margin: 12px 0; }
.input-group i { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: #00ffcc; }
.input-group input { width: 100%; padding: 12px 12px 12px 36px; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; color: white; outline: none; }
.btn-primary { width: 100%; padding: 12px; margin-top: 14px; background: linear-gradient(135deg, #00ffcc, #00c9a7); border: none; border-radius: 10px; color: #0f0c29; font-weight: 700; cursor: pointer; }
.btn-ghost { width: 100%; padding: 10px; margin-top: 8px; background: transparent; border: 1px solid rgba(0,255,204,0.3); border-radius: 10px; color: #00ffcc; cursor: pointer; }
.toast { position: fixed; bottom: 25px; right: 25px; background: #00ffcc; color: #0f0c29; padding: 10px 20px; border-radius: 10px; font-weight: 600; opacity: 0; transition: 0.3s; z-index: 999; }
.toast.show { opacity: 1; }
.dashboard { display: none; }
.sidebar { position: fixed; left: 0; top: 0; width: 270px; height: 100vh; background: rgba(0,0,0,0.5); backdrop-filter: blur(14px); border-right: 1px solid rgba(0,255,204,0.2); padding: 18px 12px; overflow-y: auto; z-index: 200; transition: width 0.3s ease; }
.sidebar.minimized { width: 80px; }
.sidebar.minimized .nav-item span, .sidebar.minimized .group-title, .sidebar.minimized .logo p, .sidebar.minimized .logo h2 { display: none; }
.sidebar.minimized .nav-item { justify-content: center; padding: 10px 0; }
.minimize-toggle { display: flex; justify-content: flex-end; margin-bottom: 10px; }
.toggle-btn { background: rgba(0,255,204,0.2); border-radius: 20px; padding: 5px 12px; font-size: 12px; color: #00ffcc; border: 1px solid rgba(0,255,204,0.3); cursor: pointer; }
.sidebar .logo { text-align: center; margin-bottom: 20px; }
.sidebar .logo h2 { color: #00ffcc; font-size: 22px; }
.group-title { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: #00ffcc; margin: 15px 0 6px 12px; opacity: 0.8; }
.nav-item { display: flex; align-items: center; gap: 12px; color: rgba(255,255,255,0.75); padding: 10px 12px; margin: 4px 0; border-radius: 10px; cursor: pointer; transition: 0.2s; white-space: nowrap; }
.nav-item i { width: 24px; font-size: 1.1rem; }
.nav-item:hover, .nav-item.active { background: rgba(0,255,204,0.15); color: #00ffcc; }
.main { margin-left: 270px; padding: 20px 25px; min-height: 100vh; transition: margin-left 0.3s ease; }
.sidebar.minimized ~ .main { margin-left: 80px; }
.topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; padding-bottom: 12px; border-bottom: 1px solid rgba(255,255,255,0.08); flex-wrap: wrap; gap: 12px; }
.welcome-area h2 { font-size: 1.2rem; font-weight: 500; }
.welcome-area h2 span { color: #00ffcc; }
.profile-top { display: flex; align-items: center; gap: 12px; background: rgba(0,255,204,0.1); padding: 5px 16px 5px 10px; border-radius: 40px; border: 1px solid rgba(0,255,204,0.2); cursor: pointer; }
.avatar-sm { width: 38px; height: 38px; background: linear-gradient(135deg, #00ffcc, #00c9a7); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; color: #0f0c29; font-size: 18px; }
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 25px; }
.card { background: rgba(255,255,255,0.06); padding: 20px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.08); }
.card-icon { width: 42px; height: 42px; background: rgba(0,255,204,0.15); border-radius: 10px; display: flex; align-items: center; justify-content: center; color: #00ffcc; margin-bottom: 12px; }
.card h4 { font-size: 12px; color: rgba(255,255,255,0.5); }
.card-value { font-size: 22px; font-weight: 700; }
.ref-card, .action-card { background: rgba(0,255,204,0.07); border: 1px solid rgba(0,255,204,0.2); border-radius: 16px; padding: 20px; margin-top: 16px; }
.ref-row { display: flex; align-items: center; gap: 10px; background: rgba(0,0,0,0.2); border-radius: 10px; padding: 10px 14px; }
.copy-btn { padding: 6px 14px; background: #00ffcc; border: none; border-radius: 7px; font-weight: bold; cursor: pointer; }
.action-buttons { display: flex; gap: 15px; margin-top: 15px; flex-wrap: wrap; }
.btn-action { flex: 1; padding: 12px; border-radius: 12px; font-weight: 600; background: rgba(0,255,204,0.2); color: #00ffcc; cursor: pointer; }
.btn-action.primary { background: #00ffcc; color: #0f0c29; }
.tab-section { display: none; }
.tab-section.active { display: block; }
.profile-card { background: rgba(255,255,255,0.06); border-radius: 16px; padding: 25px; max-width: 600px; }
.avatar-lg { width: 60px; height: 60px; background: linear-gradient(135deg, #00ffcc, #00c9a7); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: 700; color: #0f0c29; margin-bottom: 15px; }
.info-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,0.06); font-size: 13px; }
.admin-panel, .chat-container { background: rgba(0,0,0,0.3); border-radius: 16px; padding: 15px; margin-top: 15px; }
.chat-messages { height: 320px; overflow-y: auto; padding: 10px; background: rgba(0,0,0,0.2); border-radius: 16px; margin-bottom: 12px; display: flex; flex-direction: column; gap: 10px; }
.chat-bubble { max-width: 80%; padding: 8px 14px; border-radius: 18px; font-size: 13px; word-wrap: break-word; }
.chat-bubble.user { background: #00ffcc; color: #0f0c29; align-self: flex-end; border-bottom-right-radius: 4px; }
.chat-bubble.admin { background: rgba(255,255,255,0.2); color: white; align-self: flex-start; border-bottom-left-radius: 4px; }
.chat-input-area { display: flex; gap: 10px; margin-top: 10px; }
.chat-input-area input { flex: 1; padding: 10px; border-radius: 30px; border: none; background: rgba(255,255,255,0.1); color: white; outline: none; }
.chat-input-area button { background: #00ffcc; border: none; padding: 0 18px; border-radius: 30px; font-weight: bold; cursor: pointer; }
.pkg-box { background: rgba(255,255,255,0.05); border-radius: 20px; padding: 1.2rem; transition: 0.3s; border: 1px solid rgba(0,255,204,0.2); }
.primary-btn { background: linear-gradient(135deg, #00ffcc, #00c9a7); border: none; border-radius: 30px; padding: 8px 20px; color: #0f0c29; font-weight: bold; cursor: pointer; }
.team-item { padding: 6px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
.badge { padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: 600; }
.badge.success { background: rgba(0,255,100,0.15); color: #00ff64; }
.badge.warning { background: rgba(255,200,0,0.15); color: #ffc800; }
.earn-table { width: 100%; border-collapse: collapse; background: rgba(255,255,255,0.04); border-radius: 12px; overflow: hidden; }
.earn-table th { text-align: left; padding: 12px 16px; color: #00ffcc; background: rgba(0,255,204,0.08); }
.earn-table td { padding: 12px 16px; border-top: 1px solid rgba(255,255,255,0.05); font-size: 13px; }
@media (max-width: 700px) {
  .sidebar { width: 100%; height: auto; bottom: 0; top: auto; flex-direction: row; overflow-x: auto; padding: 8px; }
  .sidebar .logo, .group-title, .minimize-toggle { display: none; }
  .main { margin-left: 0 !important; padding-bottom: 80px; }
}
</style>
</head>
<body>

<div class="auth-page" id="loginPage">
  <div class="box">
    <h2><i class="fa fa-lock"></i> Zainab Login</h2>
    <div class="input-group"><i class="fa fa-envelope"></i><input type="email" id="loginEmail" placeholder="Email"></div>
    <div class="input-group"><i class="fa fa-lock"></i><input type="password" id="loginPass" placeholder="Password"></div>
    <button class="btn-primary" onclick="loginUser()">Login</button>
    <button class="btn-ghost" onclick="showRegister()">New? Register</button>
    <div style="text-align:center; margin-top:12px; font-size:12px;">Demo: admin@demo.com / admin123</div>
  </div>
</div>
<div class="auth-page" id="registerPage" style="display:none;">
  <div class="box">
    <h2><i class="fa fa-user-plus"></i> Register</h2>
    <div class="input-group"><i class="fa fa-user"></i><input type="text" id="regName" placeholder="Full Name"></div>
    <div class="input-group"><i class="fa fa-envelope"></i><input type="email" id="regEmail" placeholder="Email"></div>
    <div class="input-group"><i class="fab fa-whatsapp"></i><input type="text" id="regWhatsapp" placeholder="WhatsApp Number"></div>
    <div class="input-group"><i class="fa fa-lock"></i><input type="password" id="regPass" placeholder="Password"></div>
    <button class="btn-primary" onclick="registerUser()">Create Account</button>
    <button class="btn-ghost" onclick="showLogin()">Back</button>
  </div>
</div>

<div class="dashboard" id="dashboard">
  <div class="sidebar" id="sidebarContainer"></div>
  <div class="main">
    <div class="topbar" id="topbarArea"></div>
    <div id="tabContentContainer"></div>
  </div>
</div>
<div class="toast" id="toastMsg"></div>

<script>
// ---------- STORAGE ----------
function getUsers() { return JSON.parse(localStorage.getItem('zainab_users') || '{}'); }
function saveUsers(users) { localStorage.setItem('zainab_users', JSON.stringify(users)); }
function getWithdrawals() { return JSON.parse(localStorage.getItem('zainab_withdrawals') || '[]'); }
function saveWithdrawals(w) { localStorage.setItem('zainab_withdrawals', JSON.stringify(w)); }
function getSupportMessages() { return JSON.parse(localStorage.getItem('support_messages') || '{}'); }
function saveSupportMessages(messages) { localStorage.setItem('support_messages', JSON.stringify(messages)); }

let currentUserEmail = null;
let pollInterval = null;

function showToast(msg) { let t = document.getElementById('toastMsg'); t.innerText = msg; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 2800); }
function generateReferralCode(email) { return email.split('@')[0].substring(0,3) + Math.random().toString(36).substring(2,6).toUpperCase(); }

// Register
function registerUser() {
  let name = document.getElementById('regName').value.trim();
  let email = document.getElementById('regEmail').value.trim().toLowerCase();
  let wa = document.getElementById('regWhatsapp').value.trim();
  let pass = document.getElementById('regPass').value;
  if (!name || !email || !wa || !pass) return showToast('Fill all fields');
  let users = getUsers();
  if (users[email]) return showToast('Email exists');
  let refCode = new URLSearchParams(window.location.search).get('ref');
  let referredBy = null;
  if (refCode) for (let u in users) if (users[u].referralCode === refCode) { referredBy = u; break; }
  let referralCode = generateReferralCode(email);
  users[email] = {
    name, email, wa, password: pass, joinDate: new Date().toLocaleDateString(),
    balance: 0, totalEarnings: 0, totalCommission: 0, referralCode, referredBy, teamCount: 0,
    transactions: [], membership: 'Free', subscription: 'Starter', activePackage: null,
    packagePerks: { dailyAds: 10, adReward: 0.02, gameTokens: 1000 }
  };
  saveUsers(users);
  if (referredBy && users[referredBy]) { users[referredBy].teamCount++; saveUsers(users); }
  showToast('Account created! Please login.');
  showLogin();
}
function loginUser() {
  let email = document.getElementById('loginEmail').value.trim().toLowerCase();
  let pass = document.getElementById('loginPass').value;
  let users = getUsers();
  if (!users[email] || users[email].password !== pass) return showToast('Invalid credentials');
  currentUserEmail = email;
  sessionStorage.setItem('zainab_session', email);
  renderFullDashboard(users[email]);
  startChatPolling();
}

// ---------- CHAT ----------
function startChatPolling() {
  if (pollInterval) clearInterval(pollInterval);
  pollInterval = setInterval(() => {
    if (currentUserEmail && document.getElementById('tab-contactSupport')?.classList.contains('active')) renderLiveChat();
    if (currentUserEmail === 'admin@demo.com' && document.getElementById('adminSupportPanel')) renderAdminInbox();
  }, 1500);
}
function sendMessage(text, to = 'admin@demo.com') {
  if (!text.trim()) return;
  let msgs = getSupportMessages();
  let key = currentUserEmail === 'admin@demo.com' ? to : 'admin@demo.com';
  if (!msgs[key]) msgs[key] = [];
  msgs[key].push({ sender: currentUserEmail, text: text.trim(), timestamp: Date.now() });
  saveSupportMessages(msgs);
  renderLiveChat();
  if (currentUserEmail === 'admin@demo.com') renderAdminInbox();
}
function renderLiveChat() {
  let container = document.getElementById('liveChatContainer');
  if (!container) return;
  let msgs = getSupportMessages();
  let conv = msgs['admin@demo.com'] || [];
  let html = `<div class="chat-messages" id="chatMsgs">`;
  conv.forEach(m => {
    let isUser = m.sender === currentUserEmail;
    html += `<div class="chat-bubble ${isUser ? 'user' : 'admin'}">${escapeHtml(m.text)}<div style="font-size:9px;opacity:0.7;">${new Date(m.timestamp).toLocaleTimeString()}</div></div>`;
  });
  html += `</div><div class="chat-input-area"><input type="text" id="chatInput" placeholder="Type message..."><button onclick="sendMessage(document.getElementById('chatInput').value); document.getElementById('chatInput').value='';">Send</button></div>`;
  container.innerHTML = html;
  document.getElementById('chatMsgs')?.scrollTo(0, 9999);
}
function renderAdminInbox() {
  let container = document.getElementById('adminSupportPanel');
  if (!container) return;
  let users = getUsers();
  let all = getSupportMessages();
  let html = `<h4>📬 User Conversations</h4><div style="max-height:300px; overflow-y:auto;">`;
  for (let uid in all) {
    if (uid === 'admin@demo.com') continue;
    let last = all[uid][all[uid].length-1];
    let name = users[uid]?.name || uid;
    html += `<div style="background:rgba(0,0,0,0.2); margin:8px 0; padding:10px; border-radius:12px; cursor:pointer;" onclick="openChatWith('${uid}')">
      <strong>${escapeHtml(name)}</strong><br><small>${escapeHtml(last?.text?.substring(0,40)||'')}</small>
    </div>`;
  }
  html += `</div><div id="adminChatDetail" style="margin-top:15px;"></div>`;
  container.innerHTML = html;
}
function openChatWith(userId) {
  let msgs = getSupportMessages();
  let conv = msgs[userId] || [];
  let detailDiv = document.getElementById('adminChatDetail');
  let html = `<div style="background:rgba(0,0,0,0.3); border-radius:16px; padding:10px;"><div class="chat-messages" style="height:260px;" id="adminChatArea">`;
  conv.forEach(m => {
    let isAdmin = m.sender === 'admin@demo.com';
    html += `<div class="chat-bubble ${isAdmin ? 'admin' : 'user'}">${escapeHtml(m.text)}<div style="font-size:9px;">${new Date(m.timestamp).toLocaleTimeString()}</div></div>`;
  });
  html += `</div><div class="chat-input-area"><input type="text" id="adminReplyInput" placeholder="Reply..."><button onclick="sendAdminReply('${userId}')">Reply</button></div></div>`;
  detailDiv.innerHTML = html;
  document.getElementById('adminChatArea')?.scrollTo(0, 9999);
}
function sendAdminReply(userId) {
  let input = document.getElementById('adminReplyInput');
  if (!input) return;
  let text = input.value.trim();
  if (!text) return;
  let msgs = getSupportMessages();
  if (!msgs[userId]) msgs[userId] = [];
  msgs[userId].push({ sender: 'admin@demo.com', text: text, timestamp: Date.now() });
  saveSupportMessages(msgs);
  input.value = '';
  openChatWith(userId);
  renderAdminInbox();
}
function escapeHtml(str) { return str.replace(/[&<>]/g, function(m){return m==='&'?'&amp;':m==='<'?'&lt;':m==='>'?'&gt;':m;}); }

// ---------- Dashboard Render ----------
function renderFullDashboard(user) {
  document.getElementById('loginPage').style.display = 'none';
  document.getElementById('registerPage').style.display = 'none';
  document.getElementById('dashboard').style.display = 'block';
  const menuGroups = [
    { title: "MAIN", items: [{ id:'dashboard', icon:'fa-tachometer-alt', label:'Dashboards' }] },
    { title: "FINANCIAL", items: [{ id:'subscription', icon:'fa-tag', label:'Subscription' }, { id:'membership', icon:'fa-id-card', label:'Membership' }, { id:'buyPackage', icon:'fa-gem', label:'Buy Package' }, { id:'withdrawPage', icon:'fa-money-bill-wave', label:'Withdraw' }, { id:'earnMoney', icon:'fa-hand-holding-usd', label:'Earn Money' }] },
    { title: "GROWTH", items: [{ id:'skillEdu', icon:'fa-graduation-cap', label:'Skill & Education' }, { id:'myTeam', icon:'fa-users', label:'My Team' }, { id:'withdrawalProofs', icon:'fa-receipt', label:'Withdrawal Proofs' }] },
    { title: "ACCOUNT", items: [{ id:'profile', icon:'fa-user', label:'Profile' }, { id:'infoService', icon:'fa-info-circle', label:'Information Service' }, { id:'contactSupport', icon:'fa-headset', label:'Contact Support' }, { id:'notifications', icon:'fa-bell', label:'Notifications' }] },
    { title: "COMMUNITY", items: [{ id:'officialGroups', icon:'fa-telegram', label:'Official Groups' }, { id:'officialTraining', icon:'fa-chalkboard-user', label:'Official Training' }] },
    { title: "SYSTEM", items: [{ id:'logout', icon:'fa-sign-out-alt', label:'LOGOUT', isLogout:true }] }
  ];
  let sidebarHtml = `<div class="minimize-toggle"><div class="toggle-btn" onclick="toggleSidebar()"><i class="fa fa-bars"></i> <span>Minimize</span></div></div><div class="logo"><h2>Zainab</h2><p>Live Support</p></div>`;
  for (let g of menuGroups) {
    sidebarHtml += `<div class="group-title">${g.title}</div>`;
    for (let item of g.items) {
      if (item.isLogout) sidebarHtml += `<div class="nav-item" onclick="logout()"><i class="fa ${item.icon}"></i><span> ${item.label}</span></div>`;
      else sidebarHtml += `<div class="nav-item" data-tab="${item.id}" onclick="switchTab('${item.id}')"><i class="fa ${item.icon}"></i><span> ${item.label}</span></div>`;
    }
  }
  document.getElementById('sidebarContainer').innerHTML = sidebarHtml;
  document.getElementById('topbarArea').innerHTML = `<div class="welcome-area"><h2>Welcome, <span>${user.name}</span> 👋</h2></div><div class="profile-top" onclick="switchTab('profile')"><div class="avatar-sm">${user.name.charAt(0).toUpperCase()}</div><div><div class="user-name">${user.name}</div><div class="user-email">${user.email}</div></div></div>`;
  const tabsHtml = `
    <div id="tab-dashboard" class="tab-section active">${dashboardContent(user)}</div>
    <div id="tab-subscription" class="tab-section"><div class="profile-card"><h3>Subscription</h3><div class="info-row"><span>Plan</span><span>${user.subscription}</span></div><button class="btn-primary" onclick="showToast('Upgrade: contact support')">Upgrade</button></div></div>
    <div id="tab-membership" class="tab-section"><div class="profile-card"><h3>Membership</h3><div class="info-row"><span>Level</span><span>${user.membership}</span></div><button class="btn-primary" onclick="showToast('Buy package to upgrade')">Upgrade</button></div></div>
    <div id="tab-buyPackage" class="tab-section">${buyPackageGrid()}</div>
    <div id="tab-withdrawPage" class="tab-section"><div class="profile-card"><h3>Withdraw</h3><p>Min $5 | Admin approval</p><button class="btn-primary" onclick="showWithdraw()">Request Withdrawal</button></div></div>
    <div id="tab-earnMoney" class="tab-section"><div class="profile-card"><h3>Daily Earnings</h3><p>📺 Daily Ads: ${user.packagePerks.dailyAds} | Reward: $${user.packagePerks.adReward}/ad</p><p>🎮 Game Tokens: ${user.packagePerks.gameTokens}/day</p><button class="btn-action" onclick="showToast('Ads feature coming soon')">Watch Ads</button></div></div>
    <div id="tab-skillEdu" class="tab-section"><div class="profile-card"><h3>Skill & Education</h3><p>Free digital marketing, web dev, AI courses</p><button class="btn-ghost" onclick="window.open('https://wa.me/923000000000','_blank')">Join Training</button></div></div>
    <div id="tab-myTeam" class="tab-section">${myTeamContent(user.email)}</div>
    <div id="tab-withdrawalProofs" class="tab-section">${withdrawalProofsContent(user.email)}</div>
    <div id="tab-profile" class="tab-section">${profileContent(user)}</div>
    <div id="tab-infoService" class="tab-section"><div class="profile-card"><h3>Info Service</h3><button class="btn-ghost" onclick="showToast('Subscribed')">Subscribe</button></div></div>
    <div id="tab-contactSupport" class="tab-section"><div class="profile-card"><h3>💬 Live Chat Support</h3><div id="liveChatContainer" class="chat-container"></div></div></div>
    <div id="tab-notifications" class="tab-section"><div class="profile-card"><h3>Notifications</h3><p>🔔 Referral bonus 10% active</p><p>📢 New packages added!</p></div></div>
    <div id="tab-officialGroups" class="tab-section"><div class="profile-card"><h3>Official Groups</h3><button class="btn-action" onclick="window.open('https://t.me/+demo','_blank')">Telegram</button></div></div>
    <div id="tab-officialTraining" class="tab-section"><div class="profile-card"><h3>Training</h3><button class="btn-ghost" onclick="showToast('Training sent')">Request Kit</button></div></div>
  `;
  document.getElementById('tabContentContainer').innerHTML = tabsHtml;
  updateStats(user);
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
  document.querySelector('.nav-item[data-tab="dashboard"]')?.classList.add('active');
  if (user.email === 'admin@demo.com') injectAdminPanel();
  renderLiveChat();
  if (user.email === 'admin@demo.com') {
    let card = document.querySelector('#tab-contactSupport .profile-card');
    if (card && !document.getElementById('adminSupportPanel')) {
      let div = document.createElement('div'); div.id = 'adminSupportPanel'; div.className = 'admin-panel'; card.parentNode.appendChild(div);
      renderAdminInbox();
    }
  }
}
function toggleSidebar() { let s = document.querySelector('.sidebar'); if(s) { s.classList.toggle('minimized'); let span = s.querySelector('.toggle-btn span'); if(span) span.innerText = s.classList.contains('minimized') ? 'Expand' : 'Minimize'; } }
function updateStats(user) {
  let month = 0; (user.transactions||[]).forEach(t=>{ if(t.type==='commission' && new Date(t.timestamp).getTime() > Date.now()-30*24*3600*1000) month+=t.amount; });
  document.getElementById('dashTotalEarnings').innerText = `$${(user.totalEarnings||0).toFixed(2)}`;
  document.getElementById('dashBalance').innerText = `$${(user.balance||0).toFixed(2)}`;
  document.getElementById('dashTeamCount').innerText = user.teamCount||0;
  document.getElementById('dashMonthEarnings').innerText = `$${month.toFixed(2)}`;
  document.getElementById('dashRefLink').innerText = `${location.origin}${location.pathname}?ref=${user.referralCode}`;
}
function dashboardContent(u) { return `<div class="cards"><div class="card"><div class="card-icon"><i class="fa fa-dollar-sign"></i></div><h4>Total Earnings</h4><div class="card-value" id="dashTotalEarnings">$0</div></div><div class="card"><div class="card-icon"><i class="fa fa-wallet"></i></div><h4>Balance</h4><div class="card-value" id="dashBalance">$0</div></div><div class="card"><div class="card-icon"><i class="fa fa-users"></i></div><h4>Team Members</h4><div class="card-value" id="dashTeamCount">0</div></div><div class="card"><div class="card-icon"><i class="fa fa-chart-line"></i></div><h4>This Month</h4><div class="card-value" id="dashMonthEarnings">$0</div></div></div><div class="ref-card"><h3>Referral Link</h3><div class="ref-row"><span id="dashRefLink">—</span><button class="copy-btn" onclick="copyRefLink()">Copy</button></div></div><div class="action-card"><h3>Deposit / Withdraw</h3><div class="action-buttons"><button class="btn-action primary" onclick="showDeposit()">Deposit</button><button class="btn-action" onclick="showWithdraw()">Withdraw</button></div></div>`; }
function myTeamContent(email) { let users=getUsers(); let list=Object.values(users).filter(u=>u.referredBy===email); if(!list.length) return `<div class="profile-card"><h3>My Team</h3><p>No referrals yet. Share your link!</p></div>`; let html=`<div class="profile-card"><h3>My Team (${list.length})</h3>`; list.forEach(m=>html+=`<div class="team-item"><i class="fa fa-user"></i> ${m.name} (${m.email})</div>`); html+=`</div>`; return html; }
function withdrawalProofsContent(email) { let u=getUsers()[email]; let wd=(u.transactions||[]).filter(t=>t.type==='withdrawal'); if(!wd.length) return `<div class="profile-card"><h3>Withdrawal History</h3><p>None</p></div>`; let html=`<div class="profile-card"><h3>Withdrawals</h3><table class="earn-table"><thead><tr><th>Date</th><th>Amount</th><th>Status</th></tr></thead><tbody>`; wd.forEach(w=>{ let st=w.status==='completed'?'<span class="badge success">Approved</span>':(w.status==='pending'?'<span class="badge warning">Pending</span>':'<span class="badge danger">Rejected</span>'); html+=`<tr><td>${new Date(w.timestamp).toLocaleDateString()}</td><td>$${w.amount.toFixed(2)}</td><td>${st}</td></tr>`;}); html+=`</tbody></table></div>`; return html; }
function profileContent(user) { return `<div class="profile-card"><div class="avatar-lg">${user.name.charAt(0)}</div><div class="info-row"><span>Name</span><span>${user.name}</span></div><div class="info-row"><span>Email</span><span>${user.email}</span></div><div class="info-row"><span>WhatsApp</span><span>${user.wa}</span></div><div class="info-row"><span>Active Package</span><span>${user.activePackage ? user.activePackage.name : 'None'}</span></div><div class="info-row"><span>Joined</span><span>${user.joinDate}</span></div></div>`; }
function buyPackageGrid() { const pkgs = [{id:1,name:"Starter",usd:1.1,pkr:320,ads:20,reward:0.04,tokens:1500,badge:"limited"},{id:2,name:"Silver",usd:2,pkr:580,ads:30,reward:0.06,tokens:2000,badge:"recommended"},{id:3,name:"Gold",usd:3,pkr:870,ads:40,reward:0.08,tokens:2500,badge:"recommended"},{id:4,name:"Platinum",usd:5,pkr:1450,ads:50,reward:0.10,tokens:3500,badge:""},{id:5,name:"Diamond",usd:10,pkr:2900,ads:70,reward:0.15,tokens:5000,badge:"🔥 Highly Recommended"},{id:6,name:"Ultimate",usd:30,pkr:8700,ads:100,reward:0.25,tokens:10000,badge:"⭐ Top Pick"}]; let html=`<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:1.2rem;">`; pkgs.forEach(p=>{ html+=`<div class="pkg-box"><div style="position:relative;"><h6>$${p.usd}</h6><h4>Rs.${p.pkr}</h4>${p.badge?`<div style="position:absolute;top:-8px;right:-8px;"><span style="background:#FFD700;padding:2px 8px;border-radius:20px;font-size:10px;">${p.badge}</span></div>`:''}</div><ul style="list-style:none;margin:10px 0;"><li>📺 Daily Ads: ${p.ads}</li><li>💰 Ad Reward: $${p.reward}</li><li>🎮 Game Tokens: ${p.tokens}</li></ul><button class="primary-btn" style="width:100%" onclick="buyPackage(${p.usd},'${p.name}',${p.ads},${p.reward},${p.tokens})">Buy Now</button></div>`; }); return html+`</div>`; }
window.buyPackage = function(price,name,ads,reward,tokens) { let users=getUsers(), u=users[currentUserEmail]; if(!u) return; if(u.balance<price) return showToast(`Need $${price}`); u.balance-=price; u.totalEarnings+=price; u.activePackage={name,price}; u.packagePerks={dailyAds:ads,adReward:reward,gameTokens:tokens}; u.transactions.push({type:'package',amount:price,desc:`Bought ${name}`,status:'completed',timestamp:new Date().toISOString()}); saveUsers(users); showToast(`✅ ${name} activated! Daily ${ads} ads, $${reward}/ad`); renderFullDashboard(u); };
window.showDeposit = function() { let amt=parseFloat(prompt("Deposit amount USD:")); if(isNaN(amt)||amt<=0) return; let users=getUsers(), u=users[currentUserEmail]; u.balance+=amt; u.totalEarnings+=amt; u.transactions.push({type:'deposit',amount:amt,desc:'Deposit',status:'completed',timestamp:new Date().toISOString()}); saveUsers(users); if(u.referredBy && users[u.referredBy]){ let r=users[u.referredBy]; let comm=amt*0.1; r.balance+=comm; r.totalEarnings+=comm; r.totalCommission+=comm; r.transactions.push({type:'commission',amount:comm,desc:`Commission from ${u.name}`,status:'completed',timestamp:new Date().toISOString()}); saveUsers(users); showToast(`$${comm.toFixed(2)} commission to referrer`); } showToast(`Deposited $${amt}`); renderFullDashboard(u); };
window.showWithdraw = function() { let amt=parseFloat(prompt("Withdraw amount (min $5):")); if(isNaN(amt)||amt<5) return showToast("Min $5"); let users=getUsers(), u=users[currentUserEmail]; if(u.balance<amt) return showToast("Insufficient"); u.balance-=amt; u.transactions.push({type:'withdrawal',amount:amt,desc:'Withdrawal request',status:'pending',timestamp:new Date().toISOString()}); saveUsers(users); let wd=getWithdrawals(); wd.push({id:'wd_'+Date.now()+'_'+Math.random(),userId:currentUserEmail,userName:u.name,userEmail:u.email,amount:amt,status:'pending'}); saveWithdrawals(wd); showToast(`Request $${amt} submitted`); renderFullDashboard(u); };
window.copyRefLink = function() { let link=document.getElementById('dashRefLink')?.innerText; if(link) { navigator.clipboard.writeText(link); showToast("Copied!"); } };
function injectAdminPanel() { let container=document.querySelector('#tab-profile .profile-card'); if(container && !document.getElementById('adminPanelDiv')){ let div=document.createElement('div'); div.id='adminPanelDiv'; div.className='admin-panel'; div.innerHTML=`<h3>Admin - Withdrawals</h3><div id="adminWdList"></div>`; container.parentNode.appendChild(div); loadAdminWithdrawals(); } }
function loadAdminWithdrawals() { let pending=getWithdrawals().filter(w=>w.status==='pending'); let div=document.getElementById('adminWdList'); if(!div) return; if(!pending.length) { div.innerHTML='<p>No pending withdrawals</p>'; return; } let html=''; pending.forEach(w=>{ html+=`<div class="withdrawal-card"><strong>${w.userName}</strong> (${w.userEmail})<br>$${w.amount}<br><button onclick="approveWithdraw('${w.id}')">✅ Approve</button> <button onclick="rejectWithdraw('${w.id}')">❌ Reject</button></div>`; }); div.innerHTML=html; }
window.approveWithdraw = function(id) { processWithdrawal(id,'approved'); }; window.rejectWithdraw = function(id) { processWithdrawal(id,'rejected'); };
function processWithdrawal(id,status) { let wd=getWithdrawals(); let idx=wd.findIndex(w=>w.id===id); if(idx===-1) return; let req=wd[idx]; wd[idx].status=status; saveWithdrawals(wd); let users=getUsers(); let u=users[req.userId]; if(u && u.transactions){ let tx=u.transactions.find(t=>t.type==='withdrawal' && t.amount===req.amount && t.status==='pending'); if(tx) tx.status=status; if(status==='rejected'){ u.balance+=req.amount; u.transactions.push({type:'refund',amount:req.amount,desc:'Rejected - refunded',status:'completed',timestamp:new Date().toISOString()}); } saveUsers(users); } showToast(`Withdrawal ${status}`); if(currentUserEmail==='admin@demo.com') renderFullDashboard(users['admin@demo.com']); else renderFullDashboard(users[currentUserEmail]); }
window.switchTab = function(tabId) { document.querySelectorAll('.tab-section').forEach(t=>t.classList.remove('active')); document.getElementById(`tab-${tabId}`)?.classList.add('active'); document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active')); document.querySelector(`.nav-item[data-tab="${tabId}"]`)?.classList.add('active'); if(tabId==='contactSupport') renderLiveChat(); if(tabId==='profile' && currentUserEmail==='admin@demo.com') loadAdminWithdrawals(); };
window.logout = function() { if(pollInterval) clearInterval(pollInterval); sessionStorage.removeItem('zainab_session'); location.reload(); };
function showRegister() { document.getElementById('loginPage').style.display='none'; document.getElementById('registerPage').style.display='flex'; }
function showLogin() { document.getElementById('registerPage').style.display='none'; document.getElementById('loginPage').style.display='flex'; }
window.onload = function() { let users=getUsers(); if(!users['admin@demo.com']){ users['admin@demo.com']={ name:'Admin', email:'admin@demo.com', wa:'923001234567', password:'admin123', joinDate:new Date().toLocaleDateString(), balance:9999, totalEarnings:0, totalCommission:0, referralCode:'ADMIN99', referredBy:null, teamCount:0, transactions:[], membership:'Admin', subscription:'VIP', activePackage:{name:'Ultimate'}, packagePerks:{dailyAds:100,adReward:0.25,gameTokens:10000} }; saveUsers(users); } let sess=sessionStorage.getItem('zainab_session'); if(sess && users[sess]){ currentUserEmail=sess; renderFullDashboard(users[sess]); startChatPolling(); } };
</script>
</body>
